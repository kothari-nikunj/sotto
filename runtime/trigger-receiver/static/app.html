<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191510">
<title>Sotto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23221c12'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='20' font-weight='600' fill='%2395b2a4' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="site">
  <header class="sidebar">
    <a class="brand" href="#now">Sotto</a>
    <nav class="nav nav-tabs" id="navlinks" aria-label="Main">
      <a href="#now" data-nav="now">Now</a>
      <a href="#activity" data-nav="activity">Activity</a>
      <a href="#memory" data-nav="memory">Memory</a>
      <a href="#labels" data-nav="labels">Labels</a>
      <a href="/setup" class="nav-setup">Integrations</a>
    </nav>
    <!-- On a phone the nav is the bottom tab bar, so Integrations keeps a home
         up here instead. -->
    <a class="top-setup" href="/setup">Integrations</a>
    <p class="sidebar-foot">your private chief of staff</p>
  </header>
  <!-- Every pre-redesign address still resolves. Each entry names a route
       app.js keeps (so an old bookmark renders the page it meant) and the tab
       that should light up while it is open. app.js reads this list. -->
  <div id="nav-aliases" hidden>
    <span data-nav="today" data-home="now"></span>
    <span data-nav="loops" data-home="now"></span>
    <span data-nav="cadence" data-home="activity"></span>
    <span data-nav="record" data-home="activity"></span>
    <span data-nav="briefs" data-home="activity"></span>
    <span data-nav="people" data-home="memory"></span>
    <span data-nav="learned" data-home="memory"></span>
  </div>
  <main class="content content-tabs" id="view" tabindex="-1">
    <noscript>
      <div class="card noscript-card">
        <h2>Turn JavaScript on</h2>
        <p>The dashboard renders your data in the browser. Enable JavaScript and reload this page.</p>
      </div>
    </noscript>
  </main>
</div>
</body>
</html>
