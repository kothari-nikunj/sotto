# Hermes config for Sotto (SPEC §4). Copy to ~/.hermes/config.yaml and fill <…>.
model: gemini-3.7-flash                     # NATIVE Gemini id (gemini provider + GEMINI_API_KEY);
                                            # "google/…" would route via OpenRouter and need OPENROUTER_API_KEY

mcp_servers:
  sotto-local:                               # the Bridge, via the receiver's ALWAYS-UP reverse relay:
    url: "http://127.0.0.1:8787/mcp"          # the Mac dials OUT to the container — no tunnel, no
    headers:                                  # BRIDGE_URL. On the cloud, start.sh registers this for
      Authorization: "Bearer <BRIDGE_TOKEN>"  # you (port = $PORT); shown here for local installs.
  granola:                                    # optional; NOT in the Hermes MCP catalog — a community
    command: "<granola-mcp-command>"          # stdio server (see RAILWAY.md §6c / GRANOLA_MCP_CMD)
    env:
      GRANOLA_API_TOKEN: "<token>"
# Google Workspace: enable via Hermes' native integration (`hermes` setup), not an MCP block.

gateways: [whatsapp]                          # default. or telegram / slack / signal / bluebubbles (iMessage)

# NOTE: Hermes v0.20+ no longer recognizes the next two keys and logs a harmless "unrecognized key"
# warning (the scheduler is always on there). Keep them on older Hermes — scheduler.enabled is
# REQUIRED for cron there; on v0.20+ delete both blocks if the warning bothers you.
scheduler:
  enabled: true                               # required for cron (SPEC §4.1)

code_execution:
  timeout: 600                                # brief = extraction + critic in one execute_code call;
                                              # the 300s default can kill a 2–4 min brief mid-run

cron:
  wrap_response: false                        # Sotto copy is already user-facing; omit Hermes'
                                              # "Cronjob Response" header/job-id/footer envelope


# Cron jobs are created with the cronjob tool / CLI, not a config block — the schedule's ONE source
# is adapters/hermes/crons.json (start.sh and the installers register it for you). Creating one by
# hand? ALWAYS pass --name (boot dedup) and --deliver (without it output goes to the `local` sink
# and never reaches you):
#   hermes cron create "30 6 * * *" "Run my morning brief" --skill sotto-morning-brief \
#     --name sotto-morning-brief --deliver "${SOTTO_CRON_DELIVER:-whatsapp}" 

storage: /data                                # Railway volume → $SOTTO_DATA (knowledge/*, briefs/, style.json, …)
